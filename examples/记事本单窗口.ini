; 可导入的公开示例：启动或复用 Windows 记事本，并占满主显示器工作区。
[workflow]
id=notepad-example
name=记事本示例
description=单窗口比例布局示例
hotkey=

[window.1]
name=记事本
exe=C:\Windows\System32\notepad.exe
args=
workdir=C:\Windows\System32
match=记事本|Notepad ahk_exe Notepad.exe
process_args_contains=
reuse=true
wait_seconds=20

[layout]
mode=proportional
orientation=horizontal
ratios=1
gap=0
monitor=primary
native_profile=wide-left
native_layout=5
native_zones=1
native_delay_ms=700
